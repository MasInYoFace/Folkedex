<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function arrangeSongCards() {
    document.querySelectorAll("#songs tbody .song-row").forEach(function (card) {
        if (card.querySelector(":scope > .song-card-title")) return;
        const title = card.querySelector(".song-meta-preview .title-link, .title-link");
        if (title) {
            const titleSlot = document.createElement("div");
            titleSlot.className = "song-card-title";
            titleSlot.appendChild(title);
            card.insertBefore(titleSlot, card.firstChild);
        }
    });
}

let thumbnailHoverTimer = null;
let thumbnailCursorTimer = null;
let activeThumbnailContainer = null;
let activeThumbnailCopy = null;

function showThumbnailZoom(container) {
    const source = container.querySelector("canvas.thumbnail");
    const overlay = document.getElementById("pdf-hover-preview");
    if (!source || !overlay || activeThumbnailCopy) return;

    const pixelWidth = source.width || 1;
    const pixelHeight = source.height || 1;
    const maxWidth = window.innerWidth * 0.4;
    const scale = maxWidth / pixelWidth;
    const width = pixelWidth * scale;
    const height = pixelHeight * scale;

    const copy = document.createElement("canvas");
    copy.className = "pdf-hover-copy";
    copy.width = pixelWidth;
    copy.height = pixelHeight;
    copy.getContext("2d").drawImage(source, 0, 0);
    activeThumbnailCopy = copy;
    activeThumbnailContainer = container;
    overlay.replaceChildren(copy);
    overlay.style.width = width + "px";
    overlay.style.height = height + "px";
    overlay.style.display = "block";
}

function hideThumbnailZoom() {
    clearTimeout(thumbnailHoverTimer);
    clearTimeout(thumbnailCursorTimer);
    thumbnailHoverTimer = null;
    thumbnailCursorTimer = null;
    document.querySelectorAll(".thumbnail-container.cursor-zoom-ready").forEach(function (container) {
        container.classList.remove("cursor-zoom-ready");
    });
    activeThumbnailCopy = null;
    activeThumbnailContainer = null;
    const overlay = document.getElementById("pdf-hover-preview");
    if (overlay) {
        overlay.style.display = "none";
        overlay.replaceChildren();
    }
}

window.addEventListener("scroll", hideThumbnailZoom, true);

document.addEventListener("click", function (event) {
    if (!event.target.closest("#pdf-hover-preview")) return;
    const title = activeThumbnailContainer?.dataset.title;
    if (title) window.location.href = "song.html?title=" + encodeURIComponent(title);
});
document.addEventListener("pointerover", function (event) {
    const overlay = document.getElementById("pdf-hover-preview");
    if (overlay && overlay.contains(event.target)) return;
    const container = event.target.closest(".song-row .thumbnail-container");
    if (!container || container.contains(event.relatedTarget)) return;
    clearTimeout(thumbnailHoverTimer);
    clearTimeout(thumbnailCursorTimer);
    if (activeThumbnailCopy) hideThumbnailZoom();
    thumbnailCursorTimer = setTimeout(function () {
        if (container.matches(":hover")) container.classList.add("cursor-zoom-ready");
    }, 500);
    thumbnailHoverTimer = setTimeout(function () {
        if (container.matches(":hover")) {
            container.classList.remove("cursor-zoom-ready");
            showThumbnailZoom(container);
        }
    }, 1500);
});

document.addEventListener("pointerout", function (event) {
    const overlay = document.getElementById("pdf-hover-preview");
    const container = event.target.closest(".song-row .thumbnail-container");
    if (container && !container.contains(event.relatedTarget)) {
        if (overlay && overlay.contains(event.relatedTarget)) return;
        hideThumbnailZoom();
    }
    if (overlay && overlay.contains(event.target) && !overlay.contains(event.relatedTarget)) {
        if (activeThumbnailContainer && activeThumbnailContainer.contains(event.relatedTarget)) return;
        hideThumbnailZoom();
    }
});
function toggleIframe(selector, button) {
    const $iframe = $(selector);
    $iframe.slideToggle(200, () => {
        button.textContent = $iframe.is(":visible")
            ? (selector === "#piano-container" ? "Hide Piano" : "Hide Rhythm Input")
            : (selector === "#piano-container" ? "Show Piano" : "Show Rhythm Input");
    });
}

document.addEventListener("DOMContentLoaded", function () {
    // Briefly show the piano and rhythm inputs on page load, then collapse them.
    [
        ["#piano-container", "Show Piano", 1750],
        ["#rhythm-container", "Show Rhythm Input", 1500]
    ].forEach(function ([selector, showLabel, delay]) {
        setTimeout(function () {
            const $container = $(selector);
            if ($container.is(":visible")) {
                const button = document.querySelector(
                    'button[onclick*="' + selector + '"]'
                );
                $container.slideUp(700, "swing", function () {
                    if (button) button.textContent = showLabel;
                });
            }
        }, delay);
    });

    Papa.parse("folksongs.csv", {
        download: true,
        header: true,
        complete: function (results) {
            window.ALL_SONGS = (results.data || []).filter(song => song && song.Title);

            if (typeof window.initSearchAndTable !== "function") {
                console.error("Search initialization was not loaded.");
                return;
            }

            window.initSearchAndTable();
            arrangeSongCards();
            if (window.jQuery && jQuery.fn.DataTable && jQuery.fn.DataTable.isDataTable("#songs")) {
                jQuery("#songs").on("draw.dt", arrangeSongCards);
            }

            const searchBox = document.getElementById("search-box");
            if (searchBox) {
                window.ACTIVE_SEARCH_BOX = searchBox;
                searchBox.focus();
            }
        },
        error: function (error) {
            console.error("Could not load folksongs.csv:", error);
        }
    });
});

document.getElementById('list-link-btn').addEventListener('click', function() {
    const field = document.getElementById('search-field').value;

    // Convert dropdown value to safe anchor ID
    const anchor = field.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');

    // If already on list.html, scroll smoothly
    if(window.location.pathname.endsWith("list.html")) {
        const elem = document.getElementById(anchor);
        if(elem){
            elem.scrollIntoView({behavior: "smooth"});
            return; // done, no navigation needed
        }
    }

    // Otherwise, go to list.html with hash
    window.location.href = "list.html#" + anchor;
});

document.getElementById('export-btn').addEventListener('click', function() {
    window.location.href = "export.html";
});
</script>

    "Lyrics": "Search for partial lyric matches ex. fresh mackerel...",


};

function updatePlaceholder(selectElement) {

    const field = selectElement.value;
    const placeholder = placeholderMap[field] || "Search...";

    // main search
    if (selectElement.id === "search-field") {
        document.getElementById("search-box").placeholder = placeholder;
        return;
    }

    // filter rows
    const row = selectElement.closest(".multi-filter");
    if (!row) return;

    const input = row.querySelector("input");
    if (input) input.placeholder = placeholder;
}

document.addEventListener("change", function(e) {

    if (e.target.id === "search-field") {
        updatePlaceholder(e.target);
    }

    if (e.target.closest(".multi-filter") && e.target.tagName === "SELECT") {
        updatePlaceholder(e.target);
    }

});

updatePlaceholder(document.getElementById("search-field"));

const dropdown = document.getElementById("search-field");
const subText = document.querySelector("#list-link-btn .sub-text");

function updateListButtonSubtext() {
    const selectedText = dropdown.options[dropdown.selectedIndex].text;
    subText.textContent = selectedText;
}

dropdown.addEventListener("change", updateListButtonSubtext);

// initialize on page load
updateListButtonSubtext();

dropdown.addEventListener("change", updateListButtonText);

// run once on page load
updateListButtonText();

</script>

    <div id="pdf-hover-preview" aria-hidden="true"></div>
<script>
(function () {
    const table = document.getElementById("songs");
    const hideThumbnails = document.querySelector('.preview-meta[value="Hide Thumbnails"]');
    if (!table || !hideThumbnails) return;
    const syncView = () => table.classList.toggle("list-view", hideThumbnails.checked);
    hideThumbnails.addEventListener("change", syncView);
    syncView();
})();

(function () {
    const table = document.getElementById("songs");
    if (!table) return;

    function formatMetadataLabels(root) {
        root.querySelectorAll(".song-meta-preview > div").forEach(function (item) {
            if (item.dataset.metaFormatted === "true") return;
            const text = item.textContent || "";
            const colon = text.indexOf(":");
            if (colon < 0) return;

            const label = document.createElement("strong");
            label.textContent = text.slice(0, colon + 1);
            const value = document.createElement("span");
            value.textContent = text.slice(colon + 1);
            item.replaceChildren(label, value);
            item.dataset.metaFormatted = "true";
        });
    }

    formatMetadataLabels(table);
    new MutationObserver(function () {
        formatMetadataLabels(table);
    }).observe(table, { childList: true, characterData: true, subtree: true });
})();

(function () {
    const table = document.getElementById("songs");
    if (!table) return;

    table.addEventListener("pointermove", function (event) {
        const card = event.target.closest(".song-row");
        if (!card) return;
        const rect = card.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        const rotateX = (0.5 - y) * 6;
        const rotateY = (x - 0.5) * 6;
        card.style.setProperty("--card-rotate-x", rotateX + "deg");
        card.style.setProperty("--card-rotate-y", rotateY + "deg");
        card.style.setProperty("--card-shadow-x", (-rotateY * 0.8) + "px");
        card.style.setProperty("--card-shadow-y", (rotateX * 0.8) + "px");
        const shineAngle = 135 + rotateY * 3 - rotateX * 2;
        const shineRadians = shineAngle * Math.PI / 180;
        const shineProjection = (x - 0.5) * Math.cos(shineRadians) + (y - 0.5) * Math.sin(shineRadians);
        const shinePosition = Math.max(25, Math.min(75, 50 + shineProjection * 70));
        card.style.setProperty("--shine-angle", shineAngle + "deg");
        card.style.setProperty("--shine-position", shinePosition.toFixed(1) + "%");
        const distance = Math.min(1, Math.hypot(x - 0.5, y - 0.5) / Math.hypot(0.5, 0.5));
        card.style.setProperty("--shine-opacity", (0.32 + distance * 0.28).toFixed(2));
    });

    table.addEventListener("pointerout", function (event) {
        const card = event.target.closest(".song-row");
        if (!card || card.contains(event.relatedTarget)) return;
        card.style.setProperty("--card-rotate-x", "0deg");
        card.style.setProperty("--card-rotate-y", "0deg");
        card.style.setProperty("--card-shadow-x", "0px");
        card.style.setProperty("--card-shadow-y", "0px");
        card.style.setProperty("--shine-opacity", "0");
        card.style.setProperty("--shine-angle", "135deg");
    });
})();
</script>
